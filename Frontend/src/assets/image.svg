<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Definição de Cor Única / Gradiente Suave -->
  <defs>
    <linearGradient id="inteaBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002B8A"></stop>
      <stop offset="100%" stop-color="#001F68"></stop>
    </linearGradient>
  </defs>

  <!-- Grupo do Ícone Centralizado -->
  <g transform="translate(35, 35)">
    <!-- Peça/Símbolo Conectado (Cérebro & Conexões) -->
    <path d="M 40,20 
             C 55,20 55,5 70,5 
             C 85,5 85,20 100,20 
             C 115,20 115,35 115,50 
             C 115,65 100,65 100,80 
             C 100,95 85,95 70,95 
             C 55,95 55,80 40,80 
             C 25,80 25,65 25,50 
             C 25,35 40,35 40,20 Z" fill="url(#inteaBlueGrad)" data-index="0"></path>

    <!-- Pontos de Conexão -->
    <circle cx="70" cy="50" r="10" fill="#FFFFFF"></circle>
    <circle cx="70" cy="50" r="5" fill="#002B8A"></circle>
    <circle cx="40" cy="35" r="4" fill="#FFFFFF" opacity="0.85"></circle>
    <circle cx="100" cy="65" r="4" fill="#FFFFFF" opacity="0.85"></circle>
    
    <!-- Linhas de Conexão -->
    <line x1="40" y1="35" x2="70" y2="50" stroke="#FFFFFF" stroke-width="2" opacity="0.65"></line>
    <line x1="100" y1="65" x2="70" y2="50" stroke="#FFFFFF" stroke-width="2" opacity="0.65"></line>
  </g>
</svg>