# =============================================================================
# docker-compose.yml — Orquestração de Containers (InTEA)
#
# Comandos:
#   Rodar ambos:            docker compose up --build -d
#   Rodar só o Backend:     docker compose up --build backend
#   Rodar só o Frontend:    docker compose up --build frontend
#   Parar tudo:             docker compose down
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Backend (Node.js + Express + TypeScript)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
      target: production
    container_name: intea-backend
    restart: unless-stopped
    env_file:
      - path: ./Backend/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
    ports:
      - "3000:3000"
    networks:
      - intea-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Frontend (React 19 + Vite + Tailwind v4 + Nginx)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    container_name: intea-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - intea-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5173/nginx-health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  intea-network:
    driver: bridge
    name: intea-network
