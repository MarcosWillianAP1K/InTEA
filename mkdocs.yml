# =============================================================================
# InTEA: Catálogo Moderno de Funções e Docstrings (Material Theme)
# =============================================================================

site_name: InTEA — Funções & Docstrings
site_description: Referência rápida e intuitiva das funções e docstrings do projeto InTEA
site_author: Equipe InTEA

docs_dir: docs_site
site_dir: site

theme:
  name: material
  language: pt-BR
  palette:
    # Modo Claro
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Mudar para modo escuro
    # Modo Escuro
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Mudar para modo claro
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - toc:
      permalink: true
  - tables
  - attr_list

nav:
  - Visão Geral: index.md
  - Backend (Clínico):
      - Anotações Clínicas: anotacao.md
      - Trilha de Auditoria: auditoria.md
      - Sessão e Pareamento: sessao.md
      - Telemetria e Métricas: telemetria.md
  - Backend (Administração):
      - Autenticação e Perfil: auth.md
      - Catálogo de Jogos: jogos.md
      - Gestão de Pacientes: paciente.md
      - Gestão de Terapeutas: terapeuta.md
  - Infraestrutura & Core:
      - Exemplos e Utilitários: exemplo.md
      - Eventos e Middlewares: core.md
  - Frontend:
      - Hooks e Serviços React: frontend.md
